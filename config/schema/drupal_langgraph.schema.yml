drupal_langgraph.process_flows:
  type: config_object
  label: 'Drupal LangGraph process flow registry'
  mapping:
    flows:
      type: sequence
      label: 'Custom process flows'
      sequence:
        type: mapping
        mapping:
          id:
            type: string
            label: 'Flow ID'
          label:
            type: label
            label: 'Flow label'
          description:
            type: text
            label: 'Description'
          owner:
            type: string
            label: 'Owner seat ID'
          status:
            type: string
            label: 'Status'
          graph_type:
            type: string
            label: 'Graph type'
          primary_section:
            type: string
            label: 'Primary section'
          default_entrypoint:
            type: string
            label: 'Default entrypoint'
          version:
            type: string
            label: 'Version'
          source:
            type: string
            label: 'Source'
          state_schema_summary:
            type: text
            label: 'State schema summary'
          nodes:
            type: sequence
            label: 'Nodes'
            sequence:
              type: string
          routing_rules:
            type: sequence
            label: 'Routing rules'
            sequence:
              type: string
          tools:
            type: sequence
            label: 'Tools'
            sequence:
              type: string
          prompt_notes:
            type: text
            label: 'Prompt notes'
          node_breakdown:
            type: sequence
            label: 'Detailed node breakdown'
            sequence:
              type: mapping
              mapping:
                parent_node:
                  type: string
                  label: 'Parent node'
                internal_step:
                  type: string
                  label: 'Internal step'
                owner_seat:
                  type: string
                  label: 'Owner seat ID'
                owner_binding:
                  type: string
                  label: 'Owner binding'
                handoff_flow_id:
                  type: string
                  label: 'Downstream handoff flow ID'
                purpose:
                  type: text
                  label: 'Purpose'
                state_effect:
                  type: text
                  label: 'State effect'
          transitions:
            type: sequence
            label: 'Directed transitions'
            sequence:
              type: mapping
              mapping:
                from_node:
                  type: string
                  label: 'From node'
                to_node:
                  type: string
                  label: 'To node'
                kind:
                  type: string
                  label: 'Transition kind'
                condition:
                  type: string
                  label: 'Condition / label'
