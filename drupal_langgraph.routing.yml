drupal_langgraph.roadmap:
  path: '/roadmap'
  defaults:
    _controller: '\Drupal\drupal_langgraph\Controller\RoadmapController::roadmap'
    _title: 'Project Roadmaps'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

drupal_langgraph.roadmap_project:
  path: '/roadmap/{project_id}'
  defaults:
    _controller: '\Drupal\drupal_langgraph\Controller\RoadmapController::roadmapProject'
    _title: 'Project Roadmap'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

drupal_langgraph.langgraph_console_home:
  path: '/admin/reports/drupal-langgraph/langgraph-console'
  defaults:
    _controller: '\Drupal\drupal_langgraph\Controller\LangGraphConsoleController::home'
    _title: 'Drupal LangGraph Console'
  requirements:
    _custom_access: '\Drupal\drupal_langgraph\Controller\LangGraphConsoleController::adminAccess'

