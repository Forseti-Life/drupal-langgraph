  defaults:
    _controller: '\Drupal\drupal_langgraph\Controller\LangGraphConsoleController::subsection'
    _title: 'Subsection'
  requirements:
    _custom_access: '\Drupal\drupal_langgraph\Controller\LangGraphConsoleController::adminAccess'
    section: 'home|build|test|run|observe|release|admin'
    subsection: '[a-z0-9-]+'
